name: Auto Translate Posts

on:
  push:
    paths:
      - 'content/posts/*.md'
    branches:
      - main
  workflow_dispatch: # Přidáno: umožňuje ruční spuštění

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai PyYAML

      - name: Get files to translate
        id: files
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Při ručním spuštění projdi všechny české články
            FILES=$(find content/posts -name "*.md" | tr '\n' ' ')
            echo "all=$FILES" >> $GITHUB_OUTPUT
            echo "any_changed=true" >> $GITHUB_OUTPUT
          else
            # Při pushi jen změněné
            echo "Checking changed files..."
            # Použijeme git diff pro zjištění změn oproti předchozímu commitu
            FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} | grep '^content/posts/.*\.md$' | tr '\n' ' ')
            if [ -z "$FILES" ]; then
              echo "any_changed=false" >> $GITHUB_OUTPUT
            else
              echo "all=$FILES" >> $GITHUB_OUTPUT
              echo "any_changed=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Translate files
        if: steps.files.outputs.any_changed == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/translate.py ${{ steps.files.outputs.all }}

      - name: Commit and push changes
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add content/en/posts/
          git commit -m "docs: auto-translate new posts [skip ci]" || echo "No changes to commit"
          git push

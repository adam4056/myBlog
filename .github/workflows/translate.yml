name: Auto Translate Posts

on:
  push:
    paths:
      - 'content/posts/*.md'
    branches:
      - main
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial for pushing changes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai PyYAML

      - name: Sync and Translate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Create English posts directory if it doesn't exist
          mkdir -p content/en/posts
          
          # Initialize a flag to track if anything was translated
          TRANSLATED=false
          
          # Loop through all Czech posts
          for file in content/posts/*.md; do
            [ -e "$file" ] || continue
            filename=$(basename "$file")
            target="content/en/posts/$filename"
            
            # Check if translation is needed:
            # 1. Target doesn't exist
            # 2. Source is newer than target
            if [ ! -f "$target" ] || [ "$file" -nt "$target" ]; then
              echo "Translating: $file"
              python scripts/translate.py "$file"
              TRANSLATED=true
            else
              echo "Skipping (up to date): $file"
            fi
          done
          
          # Export flag to the next steps
          echo "translated=$TRANSLATED" >> $GITHUB_ENV

      - name: Commit and push changes
        if: env.translated == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add content/en/posts/
          git commit -m "docs: sync and translate posts [skip ci]" || echo "No changes to commit"
          git push

baseURL: "https://adam4056.github.io/myBlog/"
languageCode: "cs"
title: "TechVizor"
theme: "PaperMod"
publishDir: "public"
enableRobotsTXT: true

# Multijazyčnost
defaultContentLanguage: "cs"
languages:
  cs:
    languageName: "Čeština"
    contentDir: "content"
    weight: 1
    params:
      title: "TechVizor"
  en:
    languageName: "English"
    contentDir: "content/en"
    weight: 2
    params:
      title: "TechVizor"

params:
  author: "Adam Skřivánek"
  keywords: ["blog", "vývoj", "programování", "AI", "bezpečnost"]
  copyright: "© 2025 Adam Skřivánek"
  showReadingTime: true
  dateFormat: "02.01.2006"
  paginate: 10
  paginatePath: "page"
  mainSections:
    - "posts"

  # Vzhled
  themeColor: "auto"
  disableThemeToggle: false
  showToc: true
  showShareButtons: false
  showLastMod: true
  showCategories: true
  showTags: true

  # Vyhledávání
  enableSearch: true
  search:
    provider: "fuse"

  # Zvýraznění kódu
  highlight:
    style: "monokai"
    lineNos: true

